<div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo" aria-hidden="true">
    <img alt="">
    <video controls playsinline preload="none" hidden></video>
    <button class="lightbox__close" type="button" aria-label="Close">×</button>
    <button class="lightbox__prev" type="button" aria-label="Previous"><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
    <button class="lightbox__next" type="button" aria-label="Next"><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
    <span class="lightbox__count"></span>
  </div>
