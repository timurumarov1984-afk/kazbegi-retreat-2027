<header class="apply-header">
    <div class="container apply-header__inner">
      <a class="brand" href="index.html" aria-label="{{ R.site.brand.name }} · {{ R.site.brand.sub }}">
        <svg aria-hidden="true"><use href="#i-logo"/></svg>
        <span>
          <span class="brand__name">{{ R.site.brand.name }}</span>
          <span class="brand__sub">{{ R.site.brand.sub }}</span>
        </span>
      </a>
      <div class="apply-header__actions">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-set-lang="ru" aria-pressed="true">RU</button>
          <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="apply-back" href="index.html">
          <svg aria-hidden="true"><use href="#i-arrow"/></svg>
          <span lang="ru">На сайт</span><span lang="en">Back to site</span>
        </a>
      </div>
    </div>
  </header>
