    - { title: { ru: "Заполните заявку", en: "Fill in the application" }, text: { ru: "Анкета на сайте — 4 коротких шага", en: "The form on this site — 4 short steps" } }
    - { title: { ru: "Поговорите с командой организаторов", en: "Talk to the organising team" }, text: { ru: "Обязательно для всех новичков", en: "Required for all newcomers" } }
    - { title: { ru: "Получите подтверждение участия", en: "Get your place confirmed" }, text: { ru: "И реквизиты для оплаты", en: "Along with payment details" } }
    - { title: { ru: "Оплатите участие", en: "Make the payment" }, text: { ru: "В течение 7 дней. Проживание — напрямую отелю при заезде", en: "Within 7 days. Accommodation is paid to the hotel at check-in" } }
    - { title: { ru: "Получите подтверждение брони", en: "Receive your booking confirmation" }, text: { ru: "Места участника и номера в Rooms, если живёте там", en: "For your place, and your room at Rooms if you stay there" } }
    - { title: { ru: "Добро пожаловать в чат участников", en: "Welcome to the participants’ chat" }, text: { ru: "Там все новости и детали перед поездкой", en: "All the news and details before the trip" } }

# ----------------------------------------------------------------------------- как добраться (travel.html)
travel:
