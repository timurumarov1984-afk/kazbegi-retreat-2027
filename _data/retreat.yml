  practice:
    title: { ru: "Групповые практики", en: "Group practice" }
    text: { ru: "С Мастером и его учениками — утром и вечером, каждый день.", en: "With the Master and his students — morning and evening, every day." }
    photo: { src: "card-practice.webp", pos: "50% 40%", alt: { ru: "Мастер на занятии в зале", en: "The Master during a session in the hall" } }
  mentors:
    title: { ru: "Наставничество", en: "Mentorship" }
    text: { ru: "1–2 встречи с наставником перед началом и поддержка на самом ретрите.", en: "1–2 meetings with a mentor before the start and support during the retreat." }
    photo: { src: "card-mentors.webp", alt: { ru: "Разговор с наставником на лугу", en: "A conversation with a mentor on a meadow" } }
  yoga:
    title: { ru: "Йога", en: "Yoga" }
    tag: { ru: "включено", en: "included" }
    text: { ru: "Утренняя практика без погони за формой и достижениями.", en: "Morning practice with no chasing of form or achievement." }
    more:
      ru: "Пространство, где можно перестать бороться с собой и расслабить контроль. Тело становится надёжной опорой для более глубокого внутреннего опыта."
      en: "A space to stop fighting yourself and loosen control. The body becomes a steady support for deeper inner experience."
    lead: { name: "", about: "" }   # имя и описание ведущего — уточняется
    photo: { src: "body-practice.webp", pos: "50% 60%", alt: { ru: "Утренняя практика на лугу", en: "Morning practice on a meadow" } }
  breathwork:
    title: { ru: "Breathwork", en: "Breathwork" }
    tag: { ru: "включено", en: "included" }
    text: { ru: "Осознанное связное дыхание — мост между сознательным и бессознательным.", en: "Conscious connected breathing — a bridge between the conscious and the unconscious." }
    more:
      ru: "Психологические и медитативные путешествия: через тело участники отпускают напряжение и эмоциональные паттерны и входят в более глубокие состояния осознанности."
      en: "Psychological and meditative journeys: through the body, participants release tension and emotional patterns and enter deeper states of awareness."
    lead: { name: "", about: "" }
    photo: { src: "card-breathwork.webp", pos: "50% 35%", alt: { ru: "Медитация в зале", en: "Meditation in the hall" } }
  massage:
    title: { ru: "Массаж", en: "Massage" }
    tag: { ru: "за отдельную плату", en: "paid separately" }
    text: { ru: "Каждый день — классический массаж всего тела и зонально.", en: "Every day — classic full-body and targeted massage." }
    lead:
      name: { ru: "Павел", en: "Pavel" }
      about:
        ru: "Работа с внутренними органами, мышцами, тканями, связками, сухожилиями и внутренними цепями. Техники настроены на разблокировку систем, восстановление кровотока, иннервации тканей и течения энергий."
        en: "Work with the internal organs, muscles, tissues, ligaments, tendons and inner chains. The techniques unblock the body’s systems and restore circulation, the innervation of tissues and the flow of energy."
    photo: { src: "card-massage.webp", alt: { ru: "Свет на деревянном полу", en: "Light on a wooden floor" } }
  fire:
    title: { ru: "Костровище", en: "Fireside evenings" }
    text: { ru: "Вечерние посиделки у огня с рефлексией и творчеством.", en: "Evening gatherings by the fire with reflection and creativity." }
    photo: { src: "card-fire.webp", alt: { ru: "Вечер у костра", en: "An evening by the fire" } }
  picnic:
    title: { ru: "Пикник", en: "Picnic" }
    text: { ru: "Два совместных обеда на территории отеля — познакомиться, пообщаться и ощутить общую атмосферу.", en: "Two shared lunches on the hotel grounds — a chance to meet, talk and feel the shared atmosphere." }
