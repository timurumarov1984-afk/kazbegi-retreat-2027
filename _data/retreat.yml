  kicker: { ru: "Стоимость", en: "Pricing" }
  title: { ru: "Стоимость *участия*", en: "The *price*" }
  lead: { ru: "Реквизиты для оплаты пришлём после подтверждения заявки. Проживание оплачивается отдельно.", en: "Payment details are sent once your application is confirmed. Accommodation is paid separately." }
  tag: { ru: "Rooms Kazbegi · {dates_short}", en: "Rooms Kazbegi · {dates_short}" }
  plan_title: { ru: "Ретрит в Казбеги", en: "Retreat in Kazbegi" }
  currency: "€"
  parts:                       # если ступеней нет: одна строка — одна цена, несколько — сумма частей (билет + орг. расходы)
    - { name: { ru: "Билет на ретрит", en: "Retreat ticket" }, price: 1000 }
  tiers:                       # ранние цены по дате ОПЛАТЫ; текущая ступень выбирается сама. Пусто — одна цена
    - { until: "2026-12-31", price: 800 }
    - { until: "2027-03-31", price: 900 }
    - { until: "2027-05-12", price: 1000 }
  after_last: ""               # что после последней ступени: "" — цена последней ступени, "closed" — приём закрыт
  provisional: true            # суммы 2026 года — заменить, когда будут суммы на 2027
  tiers_note: { ru: "Цена определяется датой оплаты, а не датой заявки.", en: "The price depends on the date you pay, not the date you apply." }
  list:
    - { ru: "Оплата в течение 7 дней после подтверждения заявки", en: "Payment within 7 days of your application being confirmed" }
    - { ru: "Криптовалюта или перевод в евро, долларах, рублях — заранее", en: "Crypto or a transfer in euros, dollars or roubles — in advance" }
    - { ru: "Приоритет на ранние цены — у тех, кто живёт в отеле ретрита", en: "Early-bird priority goes to those staying at the retreat hotel" }
    - { ru: "Только очное участие — онлайн-трансляции не будет", en: "In person only — there will be no live stream" }
  fine: { ru: "Проживание и питание не входят в стоимость.", en: "Accommodation and meals are not included." }
  intensive:                   # карточка интенсива рядом с ценой ретрита
    tag: { ru: "Rooms Kazbegi · {intensive_dates}", en: "Rooms Kazbegi · {intensive_dates}" }
    title: { ru: "Интенсив", en: "Intensive" }
    price: ""                  # число; пусто — «стоимость уточняется»
    list:
      - { ru: "Три дня углублённой практики с Мастером в малой группе", en: "Three days of deeper practice with the Master in a small group" }
      - { ru: "Заявка — та же анкета, что и на ретрит", en: "Apply with the same form as for the retreat" }
      - { ru: "Проживание на ночи интенсива бронируем через нас", en: "We book your room for the intensive nights" }
  private: { ru: "100 € / час или 50 € / 30 минут", en: "€100 per hour or €50 per 30 minutes" }
  refund_title: { ru: "Отмена и возврат", en: "Cancellation and refunds" }
  refund:                      # один текст — на главной и в FAQ
    ru: |
      Если вы оплатили участие, но не можете поехать:

      - более чем за 3 месяца до начала — возвращается 100%;
      - за 2–3 месяца — 50%;
      - менее чем за 2 месяца — оплата не возвращается.

      Если до 1 марта 2027 года наберётся недостаточно участников, ретрит отменяется и все деньги возвращаются полностью.

      Если Мастер или кто-то из организаторов не сможет провести ретрит, а также при форс-мажоре стоимость возвращается за вычетом прямых расходов (аренда зала, дорога Мастера и т. д.).

      Организация ретрита некоммерческая: средства идут на логистику, проживание и поддержку Мастера, аренду зала и оборудования.
    en: |
      If you have paid but can’t come:

      - more than 3 months before the start — 100% refund;
      - 2–3 months before — 50% refund;
      - less than 2 months before — no refund.

      If there are not enough participants by 1 March 2027, the retreat is cancelled and all payments are refunded in full.

      If the Master or one of the organisers is unable to hold the retreat, or in case of force majeure, the fee is refunded minus direct costs (venue rental, the Master’s travel, etc.).

      The retreat is run on a non-profit basis: the money covers logistics, the Master’s stay and support, and the rental of the hall and equipment.

