    ru: "Нам очень важно, чтобы атмосфера и энергия на ретрите были светлыми для всех практикующих, поэтому с каждым новичком мы знакомимся лично и сверяем намерения. **Количество мест ограничено.**"
    en: "It matters to us that the atmosphere and energy feel light for everyone who practises, so we personally talk to every newcomer to make sure our intentions resonate. **Places are limited.**"
  steps:
