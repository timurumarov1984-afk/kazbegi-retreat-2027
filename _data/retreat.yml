# ----------------------------------------------------------------------------- характер места
#  Графика и детали, которые есть только у этого ретрита: линия Казбека, грузинские буквы, дерево и лофт.
#  Сама графика — в _includes/identity/, стили — в assets/css/identity.css. Удалите раздел — сайт станет нейтральным.
identity:
  css: "identity.css"
  font: "Noto Serif Georgian"  # шрифт для грузинских слов; грузятся только нужные буквы
  watermark: "ყაზბეგი"           # «Казбеги» по-грузински — большое бледное слово за заголовком «Место»
  panorama:                    # линия Казбека внизу «Расписания»
    peak: { ru: "Казбек · 5 054 м", en: "Mount Kazbek · 5,054 m" }
    peak_ka: "მყინვარწვერი"     # грузинское имя Казбека — «ледяная вершина»
    church: { ru: "Гергети · 2 170 м", en: "Gergeti · 2,170 m" }
    church_ka: "გერგეტის სამება" # церковь Святой Троицы в Гергети

# ----------------------------------------------------------------------------- о ретрите
about:
  kicker: { ru: "О ретрите", en: "About the retreat" }
  title: { ru: "Очная практика — это *прямая передача*", en: "In-person practice is *direct transmission*" }
  quote:
    ru: "Присутствие Мастера, общее поле и ритм ежедневных медитаций. Так опыт становится яснее, а внимание — устойчивее."
    en: "The Master’s presence, the shared field and the rhythm of daily meditation. This is how experience becomes clearer and attention steadier."
  text:
    - ru: "Привет! С вами команда Искателей. Летом мы снова собираемся в горах Грузии в полюбившемся формате: практикуем с Мастером дважды в день в кругу близких по духу людей."
      en: "Hi! This is the Seekers team. This summer we gather again in the mountains of Georgia in a format many have come to love: practising with the Master twice a day among kindred spirits."
    - ru: "Мы собираемся, чтобы углубить распознавание и унести его в обычную жизнь. А между практиками — замедлиться, побыть среди своих, на природе, в сотворчестве."
      en: "We gather to deepen recognition and carry it into everyday life. And between the sessions — to slow down and be among our own people, in nature, creating together."
  photo: { src: "master.webp", pos: "50% 25%", alt: { ru: "Мастер Камильпаша на ретрите в Казбеги", en: "Master Kamilpasha at the Kazbegi retreat" } }
  photo_small: { src: "retreat-hall.webp", alt: { ru: "Практика в зале", en: "Practice in the hall" } }
  caption: { ru: "Мастер Камильпаша", en: "Master Kamilpasha" }

