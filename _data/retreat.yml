      text: { ru: "По цене группы: укажите в анкете категорию номера и даты — мы закрепим номер за вами.", en: "At the group rate: give the room category and dates in the application and we’ll hold the room for you." }
    - title: { ru: "В Rooms самостоятельно", en: "At Rooms, on your own" }
      text: { ru: "Бронь напрямую на сайте отеля — по его обычным ценам.", en: "Book directly on the hotel’s website, at its regular rates." }
