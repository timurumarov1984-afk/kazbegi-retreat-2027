      fields:
        - { name: fullname, entry: "1866626505", type: text, required: true, autocomplete: name, label: { ru: "Как тебя зовут?", en: "What’s your name?" }, hint: { ru: "Имя и фамилия — как в загранпаспорте", en: "First and last name, exactly as in your passport" }, placeholder: { ru: "Имя Фамилия", en: "First name Last name" } }
        - { name: email, entry: "150088759", type: email, required: true, autocomplete: email, label: { ru: "Электронная почта для связи", en: "Email" }, placeholder: { ru: "name@example.com", en: "name@example.com" } }
        - { name: telegram, entry: "1962739531", type: text, required: true, label: { ru: "Telegram для связи", en: "Telegram" }, hint: { ru: "Ник (например, @username) или номер телефона", en: "Username (e.g. @username) or phone number" }, placeholder: { ru: "@username", en: "@username" } }
        - { name: source, entry: "1600217376", type: textarea, required: true, label: { ru: "Откуда ты знаешь о ретрите с Мастером?", en: "How did you hear about the retreat with the Master?" } }
    - title: { ru: "Опыт практики", en: "Your practice" }
      intro: { ru: "Это поможет нам лучше подготовиться к встрече.", en: "This helps us prepare for meeting you." }
      fields:
        - { name: format, entry: "1453769740", type: fixed, value: "Оффлайн" }   # формат один — очный; вопрос обязателен в форме, отвечаем сами
        - { name: offline, entry: "561608447", type: radio, required: true, options: yes_no, label: { ru: "Есть ли у тебя опыт очных ретритов с Мастером?", en: "Have you been to in-person retreats with the Master?" } }
        - { name: offlineTimes, entry: "1333758775", type: radio, required: true, options: times, show_if: { name: offline, value: "Да" }, value_if_hidden: "Не участвовал", label: { ru: "Сколько раз?", en: "How many times?" } }
