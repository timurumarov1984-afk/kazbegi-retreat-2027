          show_if: { name: regular, value: "Да" }
          value_if_hidden: "Не участвую"
          label: { ru: "Как давно?", en: "For how long?" }
          options: [{ v: "1 месяц", en: "1 month" }, { v: "3 месяца", en: "3 months" }, { v: "6 месяцев", en: "6 months" }, { v: "Больше 1 года", en: "Over a year" }, { v: "Больше 3 лет", en: "Over 3 years" }]
        - { name: experience, entry: "8220411", type: textarea, label: { ru: "Опиши свой опыт медитативных практик", en: "Describe your meditation experience" }, hint: { ru: "Традиции, методы, сколько лет практикуешь", en: "Traditions, methods, how long you have practised" } }
    - title: { ru: "Проживание", en: "Your stay" }
      intro: { ru: "Нужны точные даты заезда и выезда, даже если будешь жить не в Rooms Kazbegi.", en: "We need exact arrival and departure dates, even if you stay outside Rooms Kazbegi." }
      fields:
        - { name: dates, entry: "1700040031", type: dates, required: true, label: { ru: "Когда приедешь и уедешь?", en: "When will you arrive and leave?" }, hint: { ru: "Ретрит идёт {dates}, интенсив — {intensive_dates}. Заезд {checkin} с {checkin_time}, выезд {checkout} (после интенсива — {intensive_checkout}) до {checkout_time}", en: "The retreat runs {dates}, the intensive {intensive_dates}. Check-in on {checkin} from {checkin_time}, check-out on {checkout} (or {intensive_checkout} after the intensive) by {checkout_time}" } }
        - { name: intensive, entry: "", type: radio, required: true, options: yes_no, label: { ru: "Планируешь остаться на интенсив {intensive_dates}?", en: "Are you planning to stay for the intensive, {intensive_dates}?" } }   # появится, когда в Google-форме будет этот вопрос: впишите его entry
        - name: stay
          entry: "1508398290"
          type: cards
          required: true
          label: { ru: "Планируешь жить в Rooms Kazbegi?", en: "Are you planning to stay at Rooms Kazbegi?" }
          hint: { ru: "Помимо лучшей кухни, в отеле есть бассейн и сауны. Для нашей группы — скидка до 40%", en: "Besides the best food, the hotel has a pool and saunas. Our group gets up to 40% off" }
          options:
            - { v: "Да, хочу забронировать номер", ru: "Да, хочу забронировать номер в Rooms", en: "Yes, I’d like to book a room at Rooms" }
            - { v: "Нет, буду жить в другом месте и приходить только на практику с мастером", ru: "Нет, буду жить в другом месте и приходить на практики", en: "No, I’ll stay elsewhere and come for the sessions" }
        - name: roommate
          entry: "1103524626"
          type: checkboxes
          required: true
          show_if: { name: stay, value: "Да, хочу забронировать номер" }
          value_if_hidden: "Живу в другом месте"
          label: { ru: "Будешь жить в номере один или вдвоём?", en: "Will you stay alone or share a room?" }
          hint: { ru: "Если знаешь, с кем хочешь жить, выбери «Другое» и укажи имя и фамилию соседа как в загранпаспорте", en: "If you know who you’d like to share with, choose “Other” and give their name exactly as in their passport" }
          options: [{ v: "Один", ru: "Один", en: "Alone" }, { v: "Вдвоем", ru: "Вдвоём", en: "Two of us" }]
          other: { ru: "Другое — с конкретным человеком", en: "Other — with a specific person" }
        - { name: child, entry: "882413745", type: textarea, show_if: { name: stay, value: "Да, хочу забронировать номер" }, label: { ru: "Будешь жить в Rooms с ребёнком?", en: "Will a child stay with you at Rooms?" }, hint: { ru: "Если да — сколько детей и сколько им лет. Доплата отеля без НДС: доп. кровать — 10 $ за ночь, завтрак для ребёнка 7–11 лет — 10 $, 12+ лет — 20 $", en: "If so, how many children and their ages. Hotel surcharges excl. VAT: extra bed $10 per night, breakfast for a child aged 7–11 $10, 12+ $20" } }
        - name: roomsWait               # обязательный вопрос формы «номера закончились» — отвечаем сами по выбору «жить в Rooms»
          entry: "1091618273"
          type: derived
          from: stay
          map: { "Да, хочу забронировать номер": "Хочу жить в Rooms! Сообщите как появится любой свободный номер!" }
          default: "Проживаю в другом месте"
        - type: note
          text: { ru: "Номер в Rooms Kazbegi бронируют организаторы: передадим твои данные в отель. Для брони нужен депозит 10% от стоимости проживания за все дни, остаток — при заселении.", en: "The organisers book your room at Rooms Kazbegi and pass your details to the hotel. Booking needs a 10% deposit of the total stay; the rest is paid at check-in." }
    - title: { ru: "Активности и условия", en: "Activities & terms" }
      intro: { ru: "Последний шаг.", en: "The last step." }
      fields:
        - { name: kids, entry: "496575736", type: radio, required: true, options: yes_no, label: { ru: "Интересна детская программа?", en: "Are you interested in the kids’ programme?" }, hint: { ru: "Оплачивается отдельно, около 40 € в день за ребёнка", en: "Paid separately, about €40 per child per day" } }
        - name: kidsCount
          entry: "2016769807"
          type: radio
          show_if: { name: kids, value: "Да" }
          label: { ru: "Сколько детей будет участвовать?", en: "How many children will take part?" }
          options: [{ v: "1 ребенок", ru: "1", en: "1" }, { v: "2 ребенка", ru: "2", en: "2" }, { v: "3 ребенка", ru: "3", en: "3" }, { v: "4 ребенка", ru: "4", en: "4" }, { v: "5 детей", ru: "5", en: "5" }]
        - { name: activitiesWanted, entry: "2093172798", type: radio, options: yes_no, label: { ru: "Интересны совместные активности, которые можно организовать заранее?", en: "Interested in shared activities we can arrange in advance?" } }
        - name: activities
          entry: "157482944"
          type: checkboxes
          show_if: { name: activitiesWanted, value: "Да" }
          label: { ru: "Какие активности тебе интересны?", en: "Which activities interest you?" }
          options:
            - { v: "Поездка на внедорожниках к достопримечательностям", ru: "Поездка на внедорожниках к достопримечательностям", en: "Off-road trip to the sights" }
            - { v: "Конная прогулка по горам", ru: "Конная прогулка по горам", en: "Horse ride in the mountains" }
            - { v: "Хайкинг с проводником", ru: "Хайкинг с проводником", en: "Guided hike" }
