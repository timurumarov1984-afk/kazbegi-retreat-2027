      text: { ru: "Просторнее, ванная из натурального дерева с тропическим душем.", en: "More spacious, with a natural-wood bathroom and a rainfall shower." }
      night: ""
      photo: { src: "room-executive.webp", alt: { ru: "Номер Executive", en: "Executive room" } }
    - name: "Signature"
      type: { ru: "просторный, с ванной", en: "spacious, with a bathtub" }
      text: { ru: "Большой номер с ванной и видом с террасы.", en: "A large room with a bathtub and a terrace view." }
      night: ""
      photo: { src: "room-signature.webp", alt: { ru: "Номер Signature", en: "Signature room" } }
  price_note:
    ru: "Цены за ночь появятся после подписания договора с отелем. Завтрак включён; к цене добавляется 18% НДС. С 51-го номера для группы — скидка 10% от цены на сайте отеля."
    en: "Nightly rates will appear once the contract with the hotel is signed. Breakfast is included; 18% VAT is added. From the 51st room on, the group gets 10% off the price on the hotel’s website."
  steps:                       # только для through_us: как идёт бронь
    - { ru: "Отмечаете в анкете, что хотите жить в Rooms, — один или вдвоём", en: "In the application, say you’d like to stay at Rooms — alone or with someone" }
    - { ru: "Подтверждаем участие и подбираем номер", en: "We confirm your place and find you a room" }
    - { ru: "Присылаем ссылку на оплату депозита — 10% стоимости за все ночи", en: "We send a link to pay the deposit — 10% of the cost of all nights" }
    - { ru: "Подтверждаем бронь, остаток оплачивается при заселении", en: "We confirm the booking; the rest is paid at check-in" }
  info:
    - title: { ru: "Оплата", en: "Payment" }
      text: { ru: "Банковской картой по персональной ссылке от отеля — пришлём её в личном сообщении. Перед оплатой внимательно прочитайте условия оплаты и отмены.", en: "By bank card via a personal link from the hotel, sent to you in a private message. Read the payment and cancellation terms carefully before paying." }
    - title: { ru: "Отмена", en: "Cancellation" }
      text: { ru: "Депозит возвращается по тем же правилам, что и оплата участия: 100% — более чем за 3 месяца, 50% — за 2–3 месяца, менее чем за 2 месяца — не возвращается.", en: "The deposit follows the same rules as the retreat fee: 100% back more than 3 months before, 50% at 2–3 months, nothing less than 2 months before." }
    - title: { ru: "Питание", en: "Meals" }
      text: { ru: "Завтрак входит в проживание. Обед и ужин — в ресторане отеля или в кафе посёлка.", en: "Breakfast is included. Lunch and dinner at the hotel restaurant or in the village cafés." }
  link: { url: "https://drive.google.com/drive/folders/177Qdydk48egib21E2DL-T3Oa7qNrJIGa?usp=sharing", label: { ru: "Все фото номеров", en: "All room photos" } }
