  fire:
    title: { ru: "Вечерние костры", en: "Evening bonfires" }
    text: { ru: "Посиделки у огня с рефлексией, музыкой и творчеством.", en: "Gatherings by the fire with reflection, music and creativity." }
    photo: { src: "card-fire.webp", alt: { ru: "Вечер у костра", en: "An evening by the fire" } }
  bbq:
    title: { ru: "Барбекю", en: "Barbecue" }
