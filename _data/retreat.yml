form:
  google_form: "https://docs.google.com/forms/d/e/1FAIpQLSdNdcz-bhe11F-3Ln2LerXR3q0brYlOSSoA6LhBOBS9X0bdsg/formResponse"
  enabled: false               # false — анкету можно посмотреть, но заявки не отправляются (черновик). true — принимаем заявки
  endpoint: ""                 # адрес Apps Script (см. apps-script/README.md). Пока пусто — заявка уходит напрямую в форму без подтверждения
  extra: { fvv: "1", pageHistory: "0,1,2,3,4", fbzx: "-3094951576178558100", partialResponse: "[null,null,\"-3094951576178558100\"]", submissionTimestamp: "-1" }
  draft_key: "retreat-apply-kazbegi-2027"
  kicker: { ru: "Анкета участника", en: "Application" }
  title: { ru: "Заявка *на ретрит*", en: "Apply for *the retreat*" }
  meta: { ru: "{dates} · Rooms Kazbegi, Степанцминда, Грузия", en: "{dates} · Rooms Kazbegi, Stepantsminda, Georgia" }
  intro: { ru: "Заполни анкету максимально подробно и осознанно. После неё команда организаторов свяжется с тобой по почте или в Telegram.", en: "Please fill in the form as fully and thoughtfully as you can. The organising team will then contact you by email or Telegram." }
  photo: { src: "kz-slope.webp" }
