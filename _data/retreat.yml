# =============================================================================
#  СОДЕРЖАНИЕ САЙТА РЕТРИТА — Казбеги 2027
#  Всё, что отличает этот ретрит от других, находится здесь. Дизайн и блоки — в шаблоне.
#
#  Как писать:
#  - ru: по-русски, en: по-английски. Если en не заполнен, показывается русский текст.
#  - *слово* в заголовке — выделение цветом.
#  - Даты — "ГГГГ-ММ-ДД". В текстах можно писать {dates}, {dates_short}, {start}, {checkin},
#    {checkout}, {checkin_time}, {checkout_time}, {intensive_dates}, {intensive_checkout},
#    {nights}, {private}, {email}, {telegram}, {rooms_from}, {steps} — сайт подставит их сам из данных ниже.
#  - Пустое значение ("" или удалённая строка) — блок или строка не показываются.
#  - Фото лежат в assets/img/. Чтобы заменить фото, положите файл с тем же именем
#    или впишите здесь новое имя. pos — какая часть фото важнее при обрезке ("50% 30%").
#
#  После правки сайт обновится сам примерно через минуту. Если в файле ошибка,
#  GitHub не обновит сайт (останется прошлая версия) и пришлёт письмо.
# =============================================================================

site:
  url: "https://timurumarov1984-afk.github.io/kazbegi-retreat-2027/"   # полный адрес сайта, со слешем в конце — нужен для превью ссылки
  draft: true                  # true — черновик: поисковики сайт не видят, в углу пометка «Черновик для согласования»
  brand:
    name: "Master’s Retreat"
    sub: "Kazbegi · Georgia · 2027"
  email: "kazbegi.retreat@gmail.com"
  telegram: "heresteam"        # без @
  rules_url: "https://docs.google.com/document/d/1uhkTW_Wl2Kt01I_s67hevnbW48xrJMRSRxvOOjTfRWY/preview"
  method_url: ""               # сайт о методе Мастера; пусто — ссылок на него нет
  analytics:
    goatcounter: ""            # имя счётчика GoatCounter (статистика без cookie), например "kazbegi2027"

# ----------------------------------------------------------------------------- главная страница и главы
home:                          # блоки главной и их порядок; уберите имя — блока не будет
  blocks: [hero, about, divider, memories, included, schedule, strip, place, pricing, chapters, final]

chapters:                      # главы — отдельные страницы (кнопки в меню и на главной); удалите строку — кнопок не будет
  intensive: { title: { ru: "Интенсив", en: "Intensive" }, text: { ru: "{intensive_dates} · три дня углублённой практики с Мастером", en: "{intensive_dates} · three days of deeper practice with the Master" }, photo: { src: "card-intensive.webp", pos: "50% 30%" } }
  stay: { title: { ru: "Проживание", en: "Accommodation" }, text: { ru: "Номера Rooms Kazbegi, цены для группы, атмосфера отеля", en: "Rooms at Rooms Kazbegi, group rates, the feel of the hotel" }, photo: { src: "room-view.webp", pos: "30% 50%" } }
  leisure: { title: { ru: "Досуг", en: "Leisure" }, text: { ru: "Горы, кухня, спа и вечера сотворчества", en: "Mountains, food, the spa and evenings of co-creation" }, photo: { src: "card-leisure.webp" } }
  join: { title: { ru: "Как попасть на ретрит", en: "How to join" }, text: { ru: "{steps} шагов — от заявки до чата участников", en: "{steps} steps — from the application to the participants’ chat" }, photo: { src: "card-mentors.webp" } }
  travel: { title: { ru: "Как добраться", en: "Getting there" }, text: { ru: "Дорога из Тбилиси, карта и что взять с собой", en: "The road from Tbilisi, the map and what to bring" }, photo: { src: "hero-2.webp", pos: "45% 50%" } }
  faq: { title: { ru: "Частые вопросы", en: "FAQ" }, text: { ru: "Оплата, проживание, организация и связь", en: "Payment, accommodation, organisation and contact" }, photo: { src: "breakfast.webp" } }

