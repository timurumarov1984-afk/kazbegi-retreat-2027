# ----------------------------------------------------------------------------- частые вопросы (faq.html); ответы — с переносами строк, списками "- " и ссылками [текст](адрес)
faq:
  - title: { ru: "Оплата", en: "Payment" }
    items:
      - q: { ru: "Как формируется стоимость ретрита?", en: "What makes up the price?" }
        a: { ru: "Организация ретрита некоммерческая. Средства идут на логистику, проживание и поддержку Мастера, аренду зала и оборудования, прочие сопутствующие расходы.", en: "The retreat is run on a non-profit basis. The money covers logistics, the Master’s stay and support, the rental of the hall and equipment, and other related costs." }
      - q: { ru: "Как можно оплатить?", en: "How can I pay?" }
        a:
          ru: |
            **Участие:** криптовалюта или перевод в евро, долларах, рублях — заранее. Реквизиты пришлём после подтверждения заявки.

            **Проживание в Rooms Kazbegi:** напрямую отелю при заезде, к цене добавляется НДС 18%.
          en: |
            **The retreat:** crypto or a transfer in euros, dollars or roubles — in advance. Payment details are sent once your application is confirmed.

            **Your room at Rooms Kazbegi:** directly to the hotel at check-in, plus 18% VAT.
      - q: { ru: "Какие условия частных занятий с Мастером?", en: "What about private sessions with the Master?" }
        a: { ru: "Такая возможность может появиться при предварительной организации. Если занятие состоится, оно оплачивается отдельно: {private}.", en: "This may be possible if arranged in advance. If a session takes place, it is paid separately: {private}." }
      - q: { ru: "Какие условия возврата?", en: "What is the refund policy?" }
        a: refund              # тот же текст, что в блоке «Отмена и возврат» на главной
      - q: { ru: "Сколько стоят дополнительные активности?", en: "How much do the optional activities cost?" }
        a: { ru: "Точные цены назовём перед ретритом или перед началом активности. Например, массаж — около 40 €.", en: "We’ll give exact prices before the retreat or before each activity. For example, a massage is about €40." }
  - title: { ru: "Проживание", en: "Accommodation" }
    items:
      - q: { ru: "Можно приехать раньше и уехать позже?", en: "Can I arrive earlier and leave later?" }
        a: { ru: "Конечно! Это лучший способ получить максимум от погружения. Дополнительные ночи до и после — по тем же ценам для группы.", en: "Of course! It’s the best way to get the most out of the immersion. Extra nights before and after are at the same group rates." }
      - q: { ru: "Во сколько заезд и выезд?", en: "What are the check-in and check-out times?" }
        a:
          ru: |
            Официальные ночи ретрита — с {checkin} по {checkout} ({nights} ночей): так утро {start} начнётся с практики с Мастером. После интенсива выезд — {intensive_checkout}.

            Время заезда и выезда, ранний заезд и поздний выезд уточним после договора с отелем.
          en: |
            The official retreat nights are {checkin} to {checkout} ({nights} nights), so the morning of {start} starts with practice. After the intensive, check-out is on {intensive_checkout}.

            Check-in and check-out times, early check-in and late check-out will be confirmed once the hotel contract is signed.
      - q: { ru: "Как забронировать номер или изменить бронь?", en: "How do I book a room or change a booking?" }
        a: { ru: "Через организаторов: укажите в анкете, что хотите жить в Rooms, категорию номера и даты — мы закрепим за вами номер по цене группы. Оплачиваете проживание напрямую отелю при заезде. Изменения брони — тоже через нас.", en: "Through the organisers: in the application, say you’d like to stay at Rooms and give the room category and dates — we hold the room for you at the group rate. You pay for your stay directly to the hotel at check-in. Changes to the booking also go through us." }
      - q: { ru: "Где посмотреть все фото номеров?", en: "Where can I see all the room photos?" }
        a: { ru: "Полная подборка — [в этой папке](https://drive.google.com/drive/folders/177Qdydk48egib21E2DL-T3Oa7qNrJIGa?usp=sharing), а описания номеров — на [сайте отеля](https://roomshotels.com/hotel/kazbegi/).", en: "The full set is [in this folder](https://drive.google.com/drive/folders/177Qdydk48egib21E2DL-T3Oa7qNrJIGa?usp=sharing), and the room descriptions are on the [hotel website](https://roomshotels.com/hotel/kazbegi/)." }
      - q: { ru: "Сколько стоит проживание?", en: "How much is accommodation?" }
        a: { ru: "От {rooms_from} $ за номер за ночь плюс НДС 18%, завтрак включён. Все цены — на странице [«Проживание»](stay.html). Оплата — напрямую отелю при заезде.", en: "From ${rooms_from} per room per night plus 18% VAT, breakfast included. All prices are on the [Accommodation](stay.html) page. You pay the hotel directly at check-in." }
      - q: { ru: "Завтрак включён?", en: "Is breakfast included?" }
        a: { ru: "Да, завтрак включён в стоимость проживания. Буфет работает до 11:00, но и после этого можно спокойно доесть.", en: "Yes, breakfast is included in the room rate. The buffet runs until 11:00, but you can take your time finishing after that." }
      - q: { ru: "А обед и ужин?", en: "What about lunch and dinner?" }
        a: { ru: "В ресторане отеля Kazbegi Kitchen или в одном из ресторанов и кафе посёлка.", en: "At the hotel’s Kazbegi Kitchen restaurant or at one of the village restaurants and cafés." }
      - q: { ru: "Что если мне не подходят условия проживания в отеле?", en: "What if the hotel doesn’t suit me?" }
        a: { ru: "Можно забронировать номер в Rooms самостоятельно на сайте отеля или выбрать гостевой дом или отель рядом — и приходить на практики и общие активности.", en: "You can book a room at Rooms yourself on the hotel website, or pick a guesthouse or hotel nearby — and come for the sessions and shared activities." }
      - q: { ru: "Можно приехать с детьми?", en: "Can I bring children?" }
        a: { ru: "Да — отметьте это в анкете. Условия для детей и дополнительные кровати уточним после договора с отелем.", en: "Yes — mention it in the application. Terms for children and extra beds will be confirmed once the hotel contract is signed." }
  - title: { ru: "Организация", en: "Organisation" }
    items:
      - q: { ru: "Будет ли онлайн-трансляция?", en: "Will there be a live stream?" }
        a: { ru: "Нет: ретрит и интенсив планируются только вживую. Присутствие Мастера, общее поле и ритм практики — в зале, а не на экране.", en: "No: the retreat and the intensive are planned in person only. The Master’s presence, the shared field and the rhythm of practice happen in the hall, not on a screen." }
      - q: { ru: "Можно приехать только на интенсив?", en: "Can I come for the intensive only?" }
        a: { ru: "Да. Интенсив — {intensive_dates}: 400 € для участников ретрита, 550 € — только интенсив. Если запишется меньше 15 человек, интенсив не состоится, и мы вернём оплату целиком.", en: "Yes. The intensive runs {intensive_dates}: €400 for retreat participants, €550 for the intensive only. If fewer than 15 people sign up, it won’t take place and we’ll refund the payment in full." }
      - q: { ru: "Где жить на интенсиве?", en: "Where do I stay for the intensive?" }
        a: { ru: "Как и на ретрите: в Rooms через нас по цене группы, в Rooms самостоятельно или в любом другом месте рядом.", en: "Just as for the retreat: at Rooms through us at the group rate, at Rooms on your own, or anywhere else nearby." }
      - q: { ru: "Почему ретрит могут отменить?", en: "Why might the retreat be cancelled?" }
        a:
          ru: |
            - Если Мастер или кто-то из организаторов не сможет его провести;
            - если до 1 марта 2027 года наберётся недостаточно участников — тогда все деньги возвращаются полностью;
            - при форс-мажоре.
          en: |
            - If the Master or one of the organisers can’t hold it;
            - if there are not enough registrations by 1 March 2027 — then all payments are refunded in full;
            - in case of force majeure.
      - q: { ru: "Что есть рядом с отелем?", en: "What is near the hotel?" }
        a: { ru: "Отель находится в посёлке Степанцминда: магазины, рестораны, аптеки.", en: "The hotel is in the village of Stepantsminda, with shops, restaurants and pharmacies." }
      - q: { ru: "Что взять с собой?", en: "What should I bring?" }
        a:
          ru: |
            - Комфортную одежду для длительной практики;
            - тёплую одежду — мы будем в горах;
            - блокнот и ручку для заметок;
            - SPF.
          en: |
            - Comfortable clothes for long sessions;
            - warm clothes — we’ll be in the mountains;
            - a notebook and pen;
            - sunscreen.
      - q: { ru: "Какая будет погода?", en: "What will the weather be like?" }
        a: { ru: "В горах погода непредсказуема, но в среднем днём около +20 °C, ночью около +10 °C.", en: "Mountain weather is unpredictable, but on average it’s about +20 °C by day and +10 °C at night." }
      - q: { ru: "Что ещё важно знать?", en: "What else is important?" }
        a: { ru: "Самое важное — внимательно изучить этот сайт и [Правила участия в ретрите]({rules}).", en: "Most importantly, read this site and the [retreat Rules]({rules}) carefully." }
  - title: { ru: "Связь", en: "Contact" }
    items:
      - q: { ru: "Как связаться с организаторами?", en: "How do I reach the organisers?" }
        a: { ru: "После заявки мы общаемся по почте {email} или в Telegram {telegram}.", en: "After you apply, we stay in touch by email at {email} or on Telegram at {telegram}." }
      - q: { ru: "Как общаться с отелем?", en: "How do I deal with the hotel?" }
        a: { ru: "Если вы пользуетесь специальными условиями группы, общение с отелем идёт через организаторов ретрита.", en: "If you use the group’s special terms, all communication with the hotel goes through the retreat organisers." }
      - q: { ru: "Будет ли чат участников?", en: "Will there be a participants’ chat?" }
        a: { ru: "Да. После одобрения заявки и оплаты участия вас добавят в чат участников ретрита.", en: "Yes. Once your application is approved and paid, you’ll be added to the participants’ chat." }

