  leisure: { title: { ru: "Досуг", en: "Leisure" }, text: { ru: "Горы, кухня, спа и вечера сотворчества", en: "Mountains, food, the spa and evenings of co-creation" }, photo: { src: "hiking.webp" } }
  join: { title: { ru: "Как попасть на ретрит", en: "How to join" }, text: { ru: "{steps} шагов — от заявки до чата участников", en: "{steps} steps — from the application to the participants’ chat" }, photo: { src: "card-mentors.webp" } }
  travel: { title: { ru: "Как добраться", en: "Getting there" }, text: { ru: "Дорога из Тбилиси, карта и что взять с собой", en: "The road from Tbilisi, the map and what to bring" }, photo: { src: "hero-2.webp", pos: "45% 50%" } }
  faq: { title: { ru: "Частые вопросы", en: "FAQ" }, text: { ru: "Оплата, проживание, организация и связь", en: "Payment, accommodation, organisation and contact" }, photo: { src: "breakfast.webp" } }

