    ru: "Практики с Мастером, поддержка наставников, йога и breathwork, вечера у огня и одно общее барбекю — чтобы каждый день был наполнен практикой, горами и живым общением."
    en: "Sessions with the Master, mentors’ support, yoga and breathwork, evenings by the fire and one shared barbecue — so every day is filled with practice, mountains and genuine connection."
